  "credits": "Koniec",
  "credits2": "Nápad, príbeh, Elena, smerovanie: človek. Vytvorené s pomocou AI.",
  "sum": "<b>Čo sa stalo:</b> Elena sa v daždivom večeri vracala domov. Auto sa z dažďa vynorilo z boku — vodič ju nevidel — a zrazilo ju na prechode. Jedenásť dní ležala v izbe 214. <b>Čo prežila:</b> jej myseľ sa vrátila tou istou cestou, akou prišla — kolíska, škôlka, prvý list, svadba, deti, cesta domov — a v každej spomienke bolo niečo zle; práve tie chyby ju viedli ďalej. <b>Ako to dopadlo:</b> zobudila sa. Pri posteli sedeli Adam, Ema a Tomi.",
  "miss": [
   "To patrí sem.",
   "Toto nie.",
   "Pozri sa znova. Pomalšie."
  ]
 }
};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const _sv=LS.get('uiw_lang','');
let L=(_sv==='sk'||_sv==='en')?_sv:'en';   /* hlavný jazyk = angličtina, slovenčina je doplnok */
const t=k=>T[L][k];

/* ---------- zvuk ---------- */
let ac=null,master=null,muted=LS.get('uiw_mute','0')==='1';
function initAudio(){
  if(ac){ac.resume&&ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
  if(ac.state==='suspended')ac.resume();
}
function tone(f,dur,vol,type='sine',when=0){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+when;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(master);o.start(t0);o.stop(t0+dur+.05);
}
function sfx(k){
  if(!ac)return;
  if(k==='good'){tone(784,.5,.09);tone(1175,.8,.06,'sine',.1)}
  if(k==='bad'){tone(150,.2,.06)}
  if(k==='open'){[523,659,784,1047].forEach((f,i)=>tone(f,1.4,.055,'sine',i*.16))}
}

/* ---------- atmosféra (dažď + tónový podklad) ---------- */
let amb={ready:false,rain:null,pad:[],padGain:null};
const ROOTS=[110,110,98,98,87.31,87.31,98,110,110,82.41];
function noiseBuffer(){
  const len=Math.floor(ac.sampleRate*4),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
  return b;
}
function ambInit(){
  if(!ac||amb.ready)return;
  const src=ac.createBufferSource();src.buffer=noiseBuffer();src.loop=true;
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=520;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  const g=ac.createGain();g.gain.value=0;
  src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);src.start();
  g.gain.linearRampToValueAtTime(.04,ac.currentTime+3.5);
  amb.rain=g;
  amb.padGain=ac.createGain();amb.padGain.gain.value=0;
  const pf=ac.createBiquadFilter();pf.type='lowpass';pf.frequency.value=780;
  amb.padGain.connect(pf);pf.connect(master);
  amb.padGain.gain.linearRampToValueAtTime(.03,ac.currentTime+4.5);
  [[1,'sine',.7],[1.5,'triangle',.4]].forEach(([mul,type,v])=>{
    const o=ac.createOscillator();o.type=type;o.frequency.value=110*mul;
    const og=ac.createGain();og.gain.value=v;o.connect(og);og.connect(amb.padGain);o.start();
    amb.pad.push({o,mul});
  });
  amb.ready=true;
}
function ambStage(i){
  if(!ac)return;ambInit();if(!amb.ready)return;
  const root=ROOTS[Math.max(0,Math.min(i,ROOTS.length-1))],now=ac.currentTime;
  amb.pad.forEach(x=>x.o.frequency.setTargetAtTime(root*x.mul,now,1.3));
  amb.rain.gain.setTargetAtTime(i>=9?.10:.04,now,1.6);
}
function heartbeat(n=4){
  if(!ac)return;
  for(let i=0;i<n;i++){const w=i*.62;tone(58,.22,.15,'sine',w);tone(50,.20,.09,'sine',w+.17)}
}
function wakeChord(){if(!ac)return;[261.63,329.63,392,587.33].forEach((f,i)=>tone(f,5,.04,'sine',i*.28))}
function ambOut(){if(!ac||!amb.ready)return;
  amb.rain.gain.setTargetAtTime(0,ac.currentTime,.7);
  amb.padGain.gain.setTargetAtTime(0,ac.currentTime,.9)}

function updSnd(){$('#bSnd').textContent=muted?'🔈':'🔊'}
$('#bSnd').onclick=()=>{muted=!muted;LS.set('uiw_mute',muted?'1':'0');initAudio();
  if(master)master.gain.setTargetAtTime(muted?0:1,ac.currentTime,.05);updSnd()};
updSnd();

/* ---------- stav ---------- */
let cur=0,locked=false,started=false,hintShown=false;
const scene=$('#scene'),spots=$('#spots'),portal=$('#portal');

function layout(){
  const W=$('#stage').clientWidth,H=$('#stage').clientHeight;
  let w=W,h=w*0.75;
  if(h>H){h=H;w=h*4/3}
  scene.style.width=w+'px';scene.style.height=h+'px';
}
addEventListener('resize',layout);
/* --- fullscreen --- */
(function(){
  const b=$('#bFull'),el=document.documentElement;
  const fs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req||window.matchMedia('(display-mode: standalone)').matches){b.style.display='none';return}
  b.onclick=()=>{
    if(fs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { req.call(el).catch(()=>{}); }
  };
  const upd=()=>{ b.textContent=fs()?'⤢':'⛶'; setTimeout(layout,120); };
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
})();
addEventListener('orientationchange',()=>setTimeout(layout,220));

function whisper(html){
  const w=$('#whisper');
  w.innerHTML=html||'';w.classList.toggle('on',!!html);
}
function label(){
  const s=D.stages[cur];
  $('#stageLbl').innerHTML=`<b>${t('stage')} ${cur+1}/${D.stages.length}</b> · ${s.t[L]}`;
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

function buildStage(i){
  cur=i;locked=false;hintShown=false;skipResolve=null;
  const s=D.stages[i];
  $('#bg').src=s.img;
  spots.innerHTML='';
  const hs=Array.isArray(s.h)?s.h:[s.h];
  hs.forEach((hh,k)=>{
    const d=document.createElement('div');
    d.className='hs';d.dataset.i=k;d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',hh.n[L]);
    d.style.left=hh.x+'%';d.style.top=hh.y+'%';d.style.width=(hh.r*2)+'%';
    spots.appendChild(d);
  });
  label();layout();
  ambStage(i);if(i===D.stages.length-1)heartbeat(4);
  const vo=$('#voice');
  vo.textContent=(s.o&&s.o[L])||'';vo.classList.toggle('on',!!(s.o&&s.o[L]));
  whisper(s.in[L]);
  requestAnimationFrame(layout);
  $('#hintBtn').textContent=t('hint');
  $('#hintBtn').classList.add('on');
  portal.classList.remove('open');
  portal.style.clipPath='circle(0px at 50% 50%)';
  portal.style.backgroundImage='none';
  LS.set('uiw3_stage',i);
}

/* ---------- klik ---------- */
scene.addEventListener('pointerup',e=>{
  if(locked){if(skipResolve)skipResolve();return;}
  initAudio();
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const h=el&&el.closest?el.closest('.hs'):null;
  if(h)return found(h,e);
  wrong();
});
spots.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'&&ev.key!==' ')return;
  const el=ev.target&&ev.target.closest?ev.target.closest('.hs'):null;
  if(!el||locked)return;
  ev.preventDefault();const r=el.getBoundingClientRect();
  found(el,{clientX:r.left+r.width/2,clientY:r.top+r.height/2});
});
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
let skipResolve=null;
function found(el,e){
  if(locked)return;
  locked=true;
  const s=D.stages[cur],r=scene.getBoundingClientRect();
  const hs=Array.isArray(s.h)?s.h:[s.h];
  const ho=hs[+el.dataset.i]||hs[0];
  el.classList.add('gone','ping');
  sfx('good');
  whisper(`<b>${ho.n[L]}</b> — ${ho.w[L]}`);
  const px=((e.clientX-r.left)/r.width)*100,py=((e.clientY-r.top)/r.height)*100;
  const nextImg=(cur+1<D.stages.length)?D.stages[cur+1].img:'assets/s11.webp';
  const goNext=()=>{if(cur+1<D.stages.length)buildStage(cur+1);else finale()};
  const openPortal=()=>{
    portal.style.backgroundImage=`url('${nextImg}')`;
    portal.style.backgroundPosition='center';
    portal.style.clipPath=`circle(0px at ${px}% ${py}%)`;
    void portal.offsetWidth;
    portal.classList.add('open');
    portal.style.clipPath=`circle(150% at ${px}% ${py}%)`;
    sfx('open');
  };
  const skip=new Promise(res=>{skipResolve=res});
  (async()=>{
    await Promise.race([sleep(1900),skip]);
    if(s.out&&s.out[L])whisper(s.out[L]);
    await Promise.race([sleep(1350),skip]);
    openPortal();
    await Promise.race([sleep(1250),skip]);
    skipResolve=null;
    goNext();
  })();
}
function wrong(){
  sfx('bad');
  whisper(t('miss')[Math.floor(Math.random()*3)]);
  setTimeout(()=>{if(!locked)whisper(D.stages[cur].in[L])},2600);
}
$('#hintBtn').onclick=()=>{
  if(hintShown||locked)return;
  hintShown=true;
  whisper(t('hintTxt'));
  const hs=spots.querySelector('.hs');
  if(hs){hs.classList.add('ping');setTimeout(()=>hs.classList.remove('ping'),1200)}
};


/* ---------- koniec ---------- */
function finale(){
  setTimeout(()=>{
    $('#endInner').innerHTML=`
      <h1>${t('finT')}<small>${t('title')} · ${t('series')}</small></h1>
      <p class="last">${t('last')}</p>
      <p>${t('ep')}</p>
      <p class="sum">${t('sum')}</p>
      <p class="creds">${t('credits')} · ${t('credits2')}</p>
      <button class="big" id="bAgain">${t('again')}</button>`;
    $('#end').style.backgroundImage="url('assets/s11.webp')";
    show('end');ambOut();wakeChord();
    $('#bAgain').onclick=()=>{LS.set('uiw3_stage',0);startGame(0)};
  },1000);
}

/* ---------- štart ---------- */
function applyLang(){
  document.documentElement.lang=L;
  $('#tTitle').textContent=t('title');
  $('#tSeries').textContent=t('series');
  $('#tIntro').textContent=t('intro');
  $('#bStart').textContent=t('start');
  $('#bCont').textContent=t('cont');
  $('#bLang').textContent=L==='sk'?'EN':'SK';
  $('#start').style.backgroundImage="url('assets/title.webp')";
  const prog=parseInt(LS.get('uiw3_stage','0'),10)||0;
  $('#bCont').style.display=(prog>0&&prog<D.stages.length)?'':'none';
  if(started)label();
}
$('#bLang').onclick=()=>{
  L=L==='sk'?'en':'sk';LS.set('uiw_lang',L);applyLang();
  if(started){
    const st=D.stages[cur]||{};
    const vo=$('#voice');const o=(st.o&&st.o[L])||'';
    vo.textContent=o;vo.classList.toggle('on',!!o);
    if(!locked)whisper((st.in&&st.in[L])||'');
    $('#hintBtn').textContent=t('hint');
    label();layout();
  }
};
function startGame(from){
  started=true;initAudio();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  setTimeout(()=>buildStage(from||0),80);
}
$('#bStart').onclick=()=>startGame(0);
$('#bCont').onclick=()=>{
  const prog=parseInt(LS.get('uiw3_stage','0'),10)||0;
  startGame(Math.min(prog,D.stages.length-1));
};

applyLang();layout();setTimeout(layout,120);setTimeout(layout,500);
</script>
</body>
</html>
