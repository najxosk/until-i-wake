<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>Kým sa zobudím / Until I Wake — beta 3</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d0b14'/><circle cx='16' cy='16' r='7' fill='%23e8c37a'/></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07060b;color:#f2ecdd;
  font-family:"Optima","Palatino Linotype",Palatino,Georgia,serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:12.5px;color:#b9aec9;flex:0 0 auto;z-index:20}
#stageLbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLbl b{color:#e8c37a;font-weight:600}
.tbtn{background:none;border:1px solid #3a3348;color:#b9aec9;border-radius:7px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scene{position:relative;overflow:hidden;background:#07060b;box-shadow:0 0 60px #0009}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  -webkit-user-drag:none;user-select:none;pointer-events:none}
#spots{position:absolute;inset:0}
.hs{position:absolute;transform:translate(-50%,-50%);border-radius:50%;min-width:46px;min-height:46px;
  aspect-ratio:1;cursor:pointer}
.hs.ping{animation:ping .9s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 #ffe9b8aa}100%{box-shadow:0 0 0 46px #ffe9b800}}
.hs.gone{pointer-events:none}
#bar{flex:0 0 auto;padding:8px 14px 12px;min-height:74px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center}
#voice{font-size:12.5px;letter-spacing:.01em;color:#9c8cad;font-style:italic;max-width:600px;
  opacity:0;transition:opacity .8s;margin-bottom:2px}
#voice.on{opacity:.9}
#whisper{font-size:14px;line-height:1.35;font-style:italic;color:#cfc3dd;max-width:640px;
  opacity:0;transition:opacity .45s}
#whisper.on{opacity:1}
#whisper b{color:#e8c37a;font-style:normal}
#hintBtn{display:none;background:none;border:1px solid #453b58;color:#a99bbd;border-radius:9px;
  padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer}
#hintBtn.on{display:inline-block}
#portal{position:absolute;inset:0;pointer-events:none;z-index:15;
  background-position:center;background-size:cover;
  clip-path:circle(0px at 50% 50%);transition:clip-path .95s cubic-bezier(.22,.9,.3,1)}
#portal.open{clip-path:circle(150% at 50% 50%)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px;z-index:30;background:#07060b center/cover no-repeat}
.screen.on{display:flex}
#start .veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#07060b44,#07060bf0 80%)}
#start .inner{position:relative;max-width:520px}
h1{font-size:clamp(30px,7.5vw,44px);font-weight:400;line-height:1.12}
h1 small{display:block;font-size:.42em;color:#a99bbd;letter-spacing:.22em;text-transform:uppercase;margin-top:12px}
#start p{color:#c3b7d4;font-size:14px;line-height:1.55;margin-top:18px}
.big{margin-top:24px;background:#e8c37a;color:#171320;border:0;border-radius:12px;padding:15px 30px;
  font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.ghost{margin-top:10px;background:none;border:1px solid #453b58;color:#c3b7d4;border-radius:12px;
  padding:12px 24px;font:inherit;font-size:14px;cursor:pointer}
#endInner{max-width:560px;background:#f6efdfee;border-radius:16px;padding:26px 18px;color:#171320}
#endInner p{font-size:15px;line-height:1.6;margin-top:14px}
.credits{font-size:11px;margin-top:24px;line-height:1.7}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="stageLbl"></div>
    <button class="tbtn" id="bSnd">🔊</button>
    <button class="tbtn" id="bLang">EN</button>
  </div>
  <div id="stage">
    <div id="scene">
      <img id="bg" alt="">
      <div id="spots"></div>
      <div id="portal"></div>
    </div>
  </div>
  <div id="bar">
    <div id="voice"></div>
    <div id="whisper"></div>
    <button id="hintBtn"></button>
  </div>
</div>

<div id="start" class="screen on">
  <div class="veil"></div>
  <div class="inner">
    <h1><span id="tTitle"></span><small id="tSeries"></small></h1>
    <p id="tIntro"></p>
    <button class="big" id="bStart"></button>
    <button class="ghost" id="bCont"></button>
  </div>
</div>

<div id="end" class="screen"><div id="endInner"></div></div>

<script>
/* =====================================================================
   Kým sa zobudím — beta 3
   Jedna vec v každej spomienke. Klik na ňu otvorí okno do ďalšej etapy.
   Žiadna tma, žiadna lampa, žiadne čierne obrazovky.
   ===================================================================== */

const D={stages:[
 {img:'assets/s01.webp',t:{sk:'Kolíska',en:'The Cradle'},
  o:{sk:'Ticho. Len prístroje a dážď za oknom.',en:'Quiet. Only the machines and the rain outside.'},
  in:{sk:'Niekto spieva. Niečo mäkké ma stráži z police.',en:'Someone is singing. Something soft is guarding me from the shelf.'},
  out:{sk:'Mama spievala, kým som nezaspala. Môj macko ma strážil z police.',en:'Mom sang until I fell asleep. My teddy watched over me from the shelf.'},
  h:{x:89.5,y:22,r:8,n:{sk:'O jedno svetlo na oblohe navyše',en:'One light too many in the sky'},w:{sk:'Mesiac aj slnko naraz. Sen si nedrží pravidlá.',en:'Moon and sun at once. A dream does not keep the rules.'}}},
 {img:'assets/s02.webp',t:{sk:'Škôlka',en:'Kindergarten'},
  o:{sk:'…dýcha sama. To je dobrý znak.',en:'…she is breathing on her own. That is a good sign.'},
  in:{sk:'Svet bol prázdny papier a ja som chcela všetky farby.',en:'The world was a blank sheet and I wanted every colour.'},
  out:{sk:'Do každého obrázka som kreslila slnko. Aj do tých nočných.',en:'I drew a sun into every picture. Even the night ones.'},
  h:[{x:80,y:44,r:5,n:{sk:'Stetoskop v polici',en:'A stethoscope on the shelf'},w:{sk:'Medzi hračkami v polici leží stetoskop. V škôlke ho nikto nepotrebuje.',en:'A stethoscope lies among the toys on the shelf. Nobody in a kindergarten needs one.'}},{x:89,y:74.5,r:5,n:{sk:'Monitor na zemi',en:'A monitor on the floor'},w:{sk:'Na koberci pri deťoch leží monitor z izby 214.',en:'A monitor from room 214 lies on the rug beside the children.'}}]},
 {img:'assets/s03.webp',t:{sk:'Prvý deň v škole',en:'First Day of School'},
  o:{sk:'Sestrička: „Hovorte na ňu. Počuje vás.“',en:'Nurse: “Talk to her. She can hear you.”'},
  in:{sk:'Mama ma pri dverách pustila za ruku. Bola som taká malá.',en:'Mum let go of my hand at the door. I was so small.'},
  out:{sk:'Zavesila som tašku na háčik a zostala. Bola som statočná.',en:'I hung my bag on the hook and stayed. I was brave.'},
  h:{x:60.5,y:90,r:7.5,n:{sk:'Plastové nazúvačky',en:'Plastic clogs'},w:{sk:'Medzi koženými topánkami jedno dieťa z inej doby.',en:'Among the leather shoes, one child from another time.'}}},
 {img:'assets/s04.webp',t:{sk:'Dospievanie',en:'Growing Up'},
  o:{sk:'Adam neodchádza z izby ani na kávu.',en:'Adam has not left the room, not even for coffee.'},
  in:{sk:'Niektoré noci som si zapisovala, čo som nevedela povedať nahlas.',en:'Some nights I wrote down what I could not say aloud.'},
  out:{sk:'Moje tajomstvá mali malý zámok. Moje srdce nie.',en:'My secrets had a small lock. My heart did not.'},
  h:{x:33,y:75,r:13,n:{sk:'Cudzie kovové zábradlie',en:'The wrong metal rail'},w:{sk:'Jej posteľ bola vždy teplá. Toto je iná posteľ.',en:'Her bed was always warm. This is a different bed.'}}},
 {img:'assets/s05.webp',t:{sk:'Prvá láska',en:'First Love'},
  o:{sk:'…mení sa jej pulz. Zavolajte rodinu.',en:'…her pulse is changing. Call the family.'},
  in:{sk:'Chodba bola dlhá a on sa tváril, že ide okolo. V ruke zložený papierik.',en:'The corridor was long and he pretended to walk past. A folded note in his hand.'},
  out:{sk:'Napísal, čo sa nikdy neodvážil povedať nahlas. Ten list som si nechala dvadsať rokov.',en:'He wrote what he never dared to say aloud. I kept that letter for twenty years.'},
  h:{x:15,y:82.5,r:5,n:{sk:'Nemocničný náramok',en:'A hospital wristband'},w:{sk:'Leží pri školskej lavici. Niekto ho stratil na ceste z izby 214.',en:'It lies by a school bench. Someone lost it on the way out of room 214.'}}},
 {img:'assets/s06.webp',t:{sk:'Odchod z domu',en:'Leaving Home'},
  o:{sk:'Ema zaspala na dvoch stoličkách pri dverách.',en:'Ema fell asleep on two chairs by the door.'},
  in:{sk:'Štyri prázdne steny. A dvere, ktoré odomykám len ja.',en:'Four empty walls. And a door only I unlock.'},
  out:{sk:'Prvý kľúč, ktorý bol len môj. Bála som sa a tešila zároveň.',en:'The first key that was only mine. I was scared and glad at once.'},
  h:{x:53,y:16,r:11,n:{sk:'Studené svetlo zhora',en:'Cold light from above'},w:{sk:'Na dom je to svetlo príliš nemocničné.',en:'That light is far too hospital-cold for a home.'}}},
 {img:'assets/s07.webp',t:{sk:'Stretnutie s Adamom',en:'Meeting Adam'},
  o:{sk:'…päť dní. Nikto nič nehovorí.',en:'…five days. Nobody says anything.'},
  in:{sk:'Daždivý utorok. Kaviareň. Cudzinec s láskavými očami.',en:'A rainy Tuesday. A café. A stranger with kind eyes.'},
  out:{sk:'Vylial mi kávu a kúpil mi novú. Rozprávali sme sa, až kým nezatvorili.',en:'He spilled my coffee and bought me another. We talked until they closed.'},
  h:{x:14.5,y:80,r:7.5,n:{sk:'Predlžovačka',en:'Power strip'},w:{sk:'V kaviarni, kde sa káva nalieva ručne.',en:'In a café where coffee is poured by hand.'}}},
 {img:'assets/s08.webp',t:{sk:'Svadba',en:'The Wedding'},
  o:{sk:'Adam jej číta listy, ktoré jej kedysi písal.',en:'Adam reads her the letters he once wrote.'},
  in:{sk:'Všetci, ktorých som ľúbila, v jednej záhrade.',en:'Everyone I loved, in one garden.'},
  out:{sk:'„Navždy,“ povedal. Verila som mu. Stále verím.',en:'“Forever,” he said. I believed him. I still do.'},
  h:{x:26.5,y:59,r:12,n:{sk:'Niekto v modrom',en:'Someone in blue'},w:{sk:'Prišla z izby 214. Ako hosť.',en:'She came from room 214. As a guest.'}}},
 {img:'assets/s09.webp',t:{sk:'Ema a Tomi',en:'Ema and Tom'},
  o:{sk:'Lekár: „Dnes prvýkrát stlačila mi ruku.“',en:'Doctor: “Today she squeezed my hand for the first time.”'},
  in:{sk:'Dva malé hlásky. Lepkavé ruky. Domov.',en:'Two small voices. Sticky hands. Home.'},
  out:{sk:'Ema nás nakreslila, ako sa držíme za ruky. „Aby sa nikto nestratil,“ povedala.',en:'Ema drew us holding hands. “So nobody gets lost,” she said.'},
  h:{x:7.5,y:51,r:5.5,n:{sk:'Skúmavky pri kávovare',en:'Test tubes by the kettle'},w:{sk:'Pri rannej káve stoja skúmavky. Tie patria do laboratória, nie do kuchyne.',en:'Test tubes stand beside the morning coffee. They belong to a laboratory, not a kitchen.'}}},
 {img:'assets/s10.webp',t:{sk:'Dážď',en:'The Rain'},
  o:{sk:'„…Mami? Prosím, zobuď sa.“',en:'“…Mom? Please wake up.”'},
  in:{sk:'Len trochu dažďa. Skoro doma.',en:'Only a little rain. Almost home.'},
  out:{sk:'Svetlá. Zvuk, akoby sa trhalo celé nebo. A potom—',en:'Lights. A sound like the sky tearing. And then—'},
  h:{x:71,y:57,r:9,n:{sk:'Nemocničná posteľ',en:'A hospital bed'},w:{sk:'Na ulici stojí niečo, čo patrí do izby 214.',en:'Something that belongs to room 214 is standing in the street.'}}},
]};

const T={
 en:{series:'Dreamers · Story I',title:'Until I Wake',
  intro:'Rain. Headlights. Then silence. Elena has been in a coma for eleven days. Somewhere deep inside she is still dreaming, walking back through every stage of her life. In each memory one thing does not belong. Tap it — and the dream opens.',
  start:'Begin the dream',cont:'Continue',stage:'Stage',hint:'Hint',
  hintTxt:'Look closer. Something here is out of place.',
  again:'Play again',finT:'Waking Up',
  last:'I am awake. You are all here. Every stage of my life was leading me back to you.',
  ep:'Elena, 38. Wife of Adam. Mother of Ema and Tom. Her body sleeps in room 214. Her mind is still walking home.',
  credits:'The End',credits2:'Human: concept, story, Elena’s character, game direction. Made with AI assistance.',
  miss:['That belongs here.','Not that one.','Keep looking.']},
 sk:{series:'Snílkovia · Príbeh I',title:'Kým sa zobudím',
  intro:'Dážď. Svetlá áut. Potom ticho. Elena je už jedenásť dní v kóme. Niekde hlboko vo vnútri stále sníva a prechádza späť každou etapou svojho života. V každej spomienke je jedna vec, ktorá tam nepatrí. Ťukni na ňu — a sen sa otvorí.',
  start:'Začať sen',cont:'Pokračovať',stage:'Etapa',hint:'Nápoveda',
  hintTxt:'Pozri sa bližšie. Niečo tu nepatrí.',
  again:'Hrať znova',finT:'Prebudenie',
  last:'Som hore. Ste tu všetci. Každá etapa môjho života ma viedla späť k vám.',
  ep:'Elena, 38 rokov. Manželka Adama. Mama Emy a Tomiho. Jej telo spí v izbe 214. Jej myseľ ešte kráča domov.',
  credits:'Koniec',credits2:'Človek: nápad, príbeh, postava Eleny, smerovanie hry. Vytvorené s pomocou AI.',
  miss:['To sem patrí.','Toto nie.','Hľadaj ďalej.']}
};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
const $=s=>document.querySelector(s);
let L=(LS.get('uiw_lang','')||((navigator.language||'').toLowerCase().startsWith('sk')||(navigator.language||'').toLowerCase().startsWith('cs')?'sk':'en'));
const t=k=>T[L][k];

/* ---------- zvuk ---------- */
let ac=null,master=null,muted=LS.get('uiw_mute','0')==='1';
function initAudio(){
  if(ac){ac.resume&&ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
}
function tone(f,dur,vol,type='sine',when=0){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+when;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(master);o.start(t0);o.stop(t0+dur+.05);
}
function sfx(k){
  if(!ac)return;
  if(k==='good'){tone(784,.5,.09);tone(1175,.8,.06,'sine',.1)}
  if(k==='bad'){tone(150,.2,.06)}
  if(k==='open'){[523,659,784,1047].forEach((f,i)=>tone(f,1.4,.055,'sine',i*.16))}
}
function updSnd(){$('#bSnd').textContent=muted?'🔈':'🔊'}
$('#bSnd').onclick=()=>{muted=!muted;LS.set('uiw_mute',muted?'1':'0');initAudio();
  if(master)master.gain.setTargetAtTime(muted?0:1,ac.currentTime,.05);updSnd()};
updSnd();

/* ---------- stav ---------- */
let cur=0,locked=false,started=false,hintShown=false;
const scene=$('#scene'),spots=$('#spots'),portal=$('#portal');

function layout(){
  const W=$('#stage').clientWidth,H=$('#stage').clientHeight;
  let w=W,h=w*0.75;
  if(h>H){h=H;w=h*4/3}
  scene.style.width=w+'px';scene.style.height=h+'px';
}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,220));

function whisper(html){
  const w=$('#whisper');
  w.innerHTML=html||'';w.classList.toggle('on',!!html);
}
function label(){
  const s=D.stages[cur];
  $('#stageLbl').innerHTML=`<b>${t('stage')} ${cur+1}/${D.stages.length}</b> · ${s.t[L]}`;
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

function buildStage(i){
  cur=i;locked=false;hintShown=false;
  const s=D.stages[i];
  $('#bg').src=s.img;
  spots.innerHTML='';
  const hs=Array.isArray(s.h)?s.h:[s.h];
  hs.forEach((hh,k)=>{
    const d=document.createElement('div');
    d.className='hs';d.dataset.i=k;
    d.style.left=hh.x+'%';d.style.top=hh.y+'%';d.style.width=(hh.r*2)+'%';
    spots.appendChild(d);
  });
  label();layout();
  const vo=$('#voice');
  vo.textContent=(s.o&&s.o[L])||'';vo.classList.toggle('on',!!(s.o&&s.o[L]));
  whisper(s.in[L]);
  $('#hintBtn').textContent=t('hint');
  $('#hintBtn').classList.add('on');
  portal.classList.remove('open');
  portal.style.clipPath='circle(0px at 50% 50%)';
  portal.style.backgroundImage='none';
  LS.set('uiw3_stage',i);
}

/* ---------- klik ---------- */
scene.addEventListener('pointerup',e=>{
  if(locked)return;
  initAudio();
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const h=el&&el.closest?el.closest('.hs'):null;
  if(h)return found(h,e);
  wrong();
});
function found(el,e){
  locked=true;
  const s=D.stages[cur],r=scene.getBoundingClientRect();
  const hs=Array.isArray(s.h)?s.h:[s.h];
  const ho=hs[+el.dataset.i]||hs[0];
  el.classList.add('gone','ping');
  sfx('good');
  whisper(`<b>${ho.n[L]}</b> — ${ho.w[L]}`);
  const px=((e.clientX-r.left)/r.width)*100,py=((e.clientY-r.top)/r.height)*100;
  const nextImg=(cur+1<D.stages.length)?D.stages[cur+1].img:'assets/s11.webp';
  setTimeout(()=>{
    portal.style.backgroundImage=`url('${nextImg}')`;
    portal.style.backgroundPosition='center';
    portal.style.clipPath=`circle(0px at ${px}% ${py}%)`;
    void portal.offsetWidth;
    portal.classList.add('open');
    portal.style.clipPath=`circle(150% at ${px}% ${py}%)`;
    sfx('open');
  },650);
  setTimeout(()=>{
    if(cur+1<D.stages.length)buildStage(cur+1);
    else finale();
  },1750);
}
function wrong(){
  sfx('bad');
  whisper(t('miss')[Math.floor(Math.random()*3)]);
  setTimeout(()=>{if(!locked)whisper(D.stages[cur].in[L])},2600);
}
$('#hintBtn').onclick=()=>{
  if(hintShown||locked)return;
  hintShown=true;
  whisper(t('hintTxt'));
  const hs=spots.querySelector('.hs');
  if(hs){hs.classList.add('ping');setTimeout(()=>hs.classList.remove('ping'),1200)}
};

/* ---------- koniec ---------- */
function finale(){
  setTimeout(()=>{
    $('#endInner').innerHTML=`
      <h1 style="color:#171320">${t('finT')}<small style="color:#5b5268">${t('title')} · ${t('series')}</small></h1>
      <p style="font-style:italic;color:#2a2438;font-weight:600">${t('last')}</p>
      <p style="color:#3a3348">${t('ep')}</p>
      <p class="credits" style="color:#5b5268">${t('credits')}<br>${t('credits2')}</p>
      <button class="big" id="bAgain">${t('again')}</button>`;
    $('#end').style.backgroundImage="url('assets/s11.webp')";
    show('end');
    $('#bAgain').onclick=()=>{LS.set('uiw3_stage',0);startGame(0)};
  },1000);
}

/* ---------- štart ---------- */
function applyLang(){
  document.documentElement.lang=L;
  $('#tTitle').textContent=t('title');
  $('#tSeries').textContent=t('series');
  $('#tIntro').textContent=t('intro');
  $('#bStart').textContent=t('start');
  $('#bCont').textContent=t('cont');
  $('#bLang').textContent=L==='sk'?'EN':'SK';
  $('#start').style.backgroundImage="url('assets/title.webp')";
  const prog=parseInt(LS.get('uiw3_stage','0'),10)||0;
  $('#bCont').style.display=(prog>0&&prog<D.stages.length)?'':'none';
  if(started)label();
}
$('#bLang').onclick=()=>{
  L=L==='sk'?'en':'sk';LS.set('uiw_lang',L);applyLang();
  if(started&&!locked)whisper(D.stages[cur].in[L]);
};
function startGame(from){
  started=true;initAudio();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  setTimeout(()=>buildStage(from||0),80);
}
$('#bStart').onclick=()=>startGame(0);
$('#bCont').onclick=()=>{
  const prog=parseInt(LS.get('uiw3_stage','0'),10)||0;
  startGame(Math.min(prog,D.stages.length-1));
};

applyLang();layout();setTimeout(layout,120);setTimeout(layout,500);
</script>
</body>
</html>
